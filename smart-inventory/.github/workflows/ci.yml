name: SmartInventory Continuous Integration (CI)

# 1. Події, що запускають pipeline: push та Pull Requests до develop і main
on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # Етап 1: Збірка та тестування коду
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Крок 1: Завантаження коду з репозиторію
    - name: Checkout repository code
      uses: actions/checkout@v3

    # Крок 2: Налаштування Node.js
    - name: Set up Node.js environment
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'

    # Крок 3: Встановлення npm-залежностей
    - name: Install dependencies
      run: npm ci

    # Крок 4: Лінтинг (перевірка стилю коду)
    - name: Run code linting check
      run: npm run lint

    # Крок 5: Запуск юніт-тестів
    - name: Run Jest Unit Tests
      run: npm run test

    # Крок 6: Компіляція проєкту (Compilation check)
    - name: Compile backend application
      run: npm run build

  # Етап 2: Збірка Docker-образу та публікація до Docker Registry
  build-and-publish-docker:
    needs: build-and-test # Виконується лише після успішного тестування
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    # Крок 1: Завантаження коду
    - name: Checkout code
      uses: actions/checkout@v3

    # Крок 2: Авторизація на Docker Hub через секретні змінні
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Крок 3: Збірка та публікація Docker-образу Backend API
    - name: Build and Push Backend Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          smartinventory/backend:latest
          smartinventory/backend:${{ github.sha }}
